CONFIG_GPIO=y
CONFIG_GPIO_ASPEED_G7=y
CONFIG_CPTRA_MCI_MBOX=y
CONFIG_CPTRA_MCI_CRYPTOGRAPHIC_MBOX=y
# Two concurrent worker threads right now (gpio, cptra_mci) - see the
# ast1030_evb/all/prj.conf precedent: catches a thread-stack overflow as a
# clean fault (MPU-backed) instead of silently corrupting an adjacent
# thread's stack or the heap.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_ZTEST=y
