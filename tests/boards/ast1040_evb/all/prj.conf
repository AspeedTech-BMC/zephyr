CONFIG_GPIO=y
CONFIG_GPIO_ASPEED_G7=y
CONFIG_CPTRA_MCI_MBOX=y
CONFIG_CPTRA_MCI_CRYPTOGRAPHIC_MBOX=y
# Two concurrent worker threads right now (gpio, cptra_mci) - see the
# ast1030_evb/all/prj.conf precedent: catches a thread-stack overflow as a
# clean fault (MPU-backed) instead of silently corrupting an adjacent
# thread's stack or the heap.
CONFIG_HWINFO=y
CONFIG_I2C=y
CONFIG_I2C_ASPEED=y
CONFIG_I2C_EEPROM_TARGET=y
CONFIG_I2C_IPMB_TARGET=y
CONFIG_I2C_TARGET=y
# More than one concurrent worker thread now - catches a thread-stack
# overflow as a clean fault (MPU-backed) instead of silently corrupting an
# adjacent thread's stack or the heap. See ast1030_evb/all/prj.conf.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ZTEST=y
