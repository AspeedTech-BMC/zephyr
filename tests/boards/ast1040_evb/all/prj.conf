CONFIG_GPIO=y
CONFIG_GPIO_ASPEED_G7=y
CONFIG_CPTRA_MCI_MBOX=y
CONFIG_CPTRA_MCI_CRYPTOGRAPHIC_MBOX=y
# Six concurrent worker threads right now (gpio, cptra_mci, i2c, otp, uart,
# spi) - see the ast1030_evb/all/prj.conf precedent: catches a thread-stack
# overflow as a clean fault (MPU-backed) instead of silently corrupting an
# adjacent thread's stack or the heap.
CONFIG_HWINFO=y
CONFIG_I2C=y
CONFIG_I2C_ASPEED=y
CONFIG_I2C_EEPROM_TARGET=y
CONFIG_I2C_IPMB_TARGET=y
CONFIG_I2C_TARGET=y
CONFIG_OTP_AST27XX=y
CONFIG_SERIAL=y
CONFIG_UART_ASPEED=y
CONFIG_FLASH=y
CONFIG_SPI=y
CONFIG_SPI_ASPEED=y
# Generic upstream SPI_NOR must stay off; see spi/prj.conf.
CONFIG_SPI_NOR=n
# More than one concurrent worker thread now - catches a thread-stack
# overflow as a clean fault (MPU-backed) instead of silently corrupting an
# adjacent thread's stack or the heap. See ast1030_evb/all/prj.conf.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ZTEST=y
# 7 ipmb targets malloc buffers at boot, starving the spi thread's heap use.
CONFIG_HEAP_MEM_POOL_SIZE=32768
