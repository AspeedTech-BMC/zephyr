CONFIG_ZTEST=y
CONFIG_FLASH=y
CONFIG_SPI=y
CONFIG_SPI_ASPEED=y
# Enabling jedec,spi-nor nodes auto-defaults the generic upstream SPI_NOR
# driver to y (DT_HAS_JEDEC_SPI_NOR_ENABLED); its private spi_nor.h is
# missing from this tree, and this test only wants the ASPEED multi-dev
# driver (auto-selected by SPI_ASPEED), so keep the generic one off.
CONFIG_SPI_NOR=n
