CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y
CONFIG_PRINTK_SYNC=y
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_I3C=y
CONFIG_I3C_USE_IBI=y
CONFIG_I3C_MIPI_HCI=y
CONFIG_I3C_MIPI_HCI_PIO=y
CONFIG_I3C_MIPI_HCI_TARGET=y
CONFIG_I3C_MIPI_HCI_ASPEED_VENDOR=y

# The controller-side child node uses the i3c-dummy-device binding so
# the dynamic-address assignment path can resolve the loopback target.
CONFIG_I3C_DUMMY_DEVICE=y
