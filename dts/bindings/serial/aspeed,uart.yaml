description: ASPEED UART

compatible: "aspeed,uart"

include: [uart-controller.yaml, pinctrl-device.yaml]

properties:
    reg:
      required: true
      description: mmio register space

    virtual:
      type: int
      required: false
      description: Virtual UART device

    virtual,port:
      type: int
      required: false
      description: Virtual UART LPC I/O port address

    virtual,sirq:
      type: int
      required: false
      description: Virtual UART LPC SerIRQ number

    virtual,sirq-polarity:
      type: int
      required: false
      description: Virtual UART LPC SerIRQ polarity

    dma:
      type: int
      required: false
      description: Enable UART DMA support

    dma,channel:
      type: int
      required: false
      description: UART DMA channel to use

    aspeed,lsc:
      type: phandle
      required: false
      description: phandle to the LSC (LPC controller) device tree node

    aspeed,reset-source:
      type: array
      required: false
      description: |
        HICR9 reset source bit and value to program before the UART is
        initialized, as <bit value>. "bit" is the bit position within the
        LSC HICR9 register (base + 0x98) and "value" is 0 or 1, the value
        to write into that bit. Requires aspeed,lsc to be set.
