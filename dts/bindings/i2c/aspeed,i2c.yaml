description: ASPEED I2C controller

compatible: "aspeed,i2c"

include:
  - name: i2c-controller.yaml
  - name: pinctrl-device.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  xfer-mode:
    type: string
    required: true
    enum:
        - "BYTE"
        - "BUFF"
        - "DMA"
    description: |
      i2c transfer type. Default value is DMA.

  i2c-version:
    type: string
    required: true
    enum:
        - "AST10x0"
        - "AST2600"
        - "AST2700"
        - "AST2700A0"
    description: |
      i2c version.

  multi-master:
    type: int
    required: true
    description: |
      i2c multi-master support. Default value is enable.

  smbus-timeout:
    type: int
    required: true
    description: |
      smbus slave timeout support. Default value is enable.
      The timeout value is set 35ms.

  manual-high-count:
    type: int
    required: true
    description: |
      manual i2c clock high part. Default value is 0.
      The value should be 0x3 ~ 0xF.0 means that this
      parameter use driver default value.

  manual-low-count:
    type: int
    required: true
    description: |
      manual i2c clock low part. Default value is 0.
      The value should be 0x3 ~ 0xF. 0 means that this
      parameter use driver default value.

  manual-sda-delay:
    type: int
    required: true
    description: |
      manual i2c sda dealy. Default value is 0.
      The value should be 0x0 ~ 0x3. 0 means that this
      parameter use driver default value.

  debounce-level:
    type: int
    required: false
    description: |
      debounce-level. Default value is 2.
      The fliexable level could be 0x2 ~ 0xFF under AST2700.
      Other projects are fixed design.
