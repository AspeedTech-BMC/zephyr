description: ASPEED Privilege Control Driver

compatible: "aspeed,prictrl"

include: base.yaml

properties:
  mlist0:
    type: array
    required: false
    description: |
      Program group 0 master list, the default master is boot mcu.

  mlist1:
    type: array
    required: false
    description: |
      Program group 1 master list, the default master is ssp.

  mlist2:
    type: array
    required: false
    description: |
      Program group 2 master list, the default master is tsp.

  mlist3:
    type: array
    required: false
    description: |
      Program group 3 master list, the default master is secure ca35.

  mlist4:
    type: array
    required: false
    description: |
      Program group 4 master list, the default master is non-secure ca35.

  mlist5:
    type: array
    required: false
    description: |
      Program group 5 master list, the default master is dp mcu.

