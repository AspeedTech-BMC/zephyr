description: ASPEED Privilege Control Driver

compatible: "aspeed,prictrl"

include: base.yaml

properties:
  mlist0:
    type: array
    required: false
    description: |
      Program group 0 master list, the default master is boot mcu.

  mlist1:
    type: array
    required: false
    description: |
      Program group 1 master list, the default master is ssp.

  mlist2:
    type: array
    required: false
    description: |
      Program group 2 master list, the default master is tsp.

  mlist3:
    type: array
    required: false
    description: |
      Program group 3 master list, the default master is secure ca35.

  mlist4:
    type: array
    required: false
    description: |
      Program group 4 master list, the default master is non-secure ca35.

  mlist5:
    type: array
    required: false
    description: |
      Program group 5 master list, the default master is dp mcu.

  clist0:
    type: phandle
    required: false
    description: |
      Program boot mcu accesses client list.

  clist1:
    type: phandle
    required: false
    description: |
      Program ssp accesses client list.

  clist2:
    type: phandle
    required: false
    description: |
      Program tsp accesses client list.

  clist3:
    type: phandle
    required: false
    description: |
      Program secure ca35 accesses client list.

  clist4:
    type: phandle
    required: false
    description: |
      Program non-secure ca35 accesses client list.

  clist5:
    type: phandle
    required: false
    description: |
      Program dp mcu accesses client list.
