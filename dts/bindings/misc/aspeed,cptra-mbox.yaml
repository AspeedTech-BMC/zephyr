description: |
  CPTRA Mailbox node for ASPEED platform.
compatible: "aspeed,cptra-mbox"

properties:
  reg:
    description: Register range for the Caliptra mailbox.
    type: array
    required: true

  aspeed,scu:
    description: Handle to the ASPEED system control unit (SCU).
    type: phandle

  aspeed,cptra-ifc:
    description: Handle to the ASPEED Caliptra SoC IFC.
    type: phandle
