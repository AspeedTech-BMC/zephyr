description: ASPEED watchdog timer controller

compatible: "aspeed,ast-watchdog-g7"

include: [base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: false

  reset-mask:
    type: array
    required: true
    description: Record default reset masks.
