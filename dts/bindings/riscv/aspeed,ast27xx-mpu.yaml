# ast27xx-mpu.yaml

description: Binding for SDRAMMC with MPU region configuration

compatible: "aspeed,ast27xx-mpu"

include: base.yaml

description: MPU region definition node

properties:
  "#mpu-cells":
    type: int
    const: 0
    required: true

  protect-name:
    type: string
    required: true
    description: Human-readable name for the protected region

  protect-start:
    type: int
    required: true
    description: Start address of the protected memory region

  protect-end:
    type: int
    required: true
    description: End address of the protected memory region

  allow:
    type: array
    required: true
    description: Flattened list of <MPU_ID, permission> pairs

child-binding:
  description: Protection level definition
  properties:
    allow:
      type: array
      required: false
      description: List of allowed MPU IDs for this protection level
