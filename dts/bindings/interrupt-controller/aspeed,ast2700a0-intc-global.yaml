description: ASPEED CPU interrupt controller in AST2700 SOC

compatible: "aspeed,ast2700a0-intc-global"

include: base.yaml

properties:
  reg:
    required: true

  irq-route-select:
    required: true
    type: string
    enum:
      - "psp"
      - "ssp"
      - "tsp"

  tx-region:
    description: phandle to the shared memory region used for data transmission
    required: false
    type: phandle

  rx-region:
    description: phandle to the shared memory region used for data reception
    required: false
    type: phandle
